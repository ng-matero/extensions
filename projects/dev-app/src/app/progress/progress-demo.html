<h2>Normal</h2>
<mtx-progress [value]="20" aria-label="Progress">20%</mtx-progress>
<mtx-progress [value]="30" aria-label="Progress" type="info">30%</mtx-progress>
<mtx-progress [value]="60" aria-label="Progress" type="success">60%</mtx-progress>
<mtx-progress [value]="50" aria-label="Progress" type="warning">50%</mtx-progress>
<mtx-progress [value]="80" aria-label="Progress" type="danger">80%</mtx-progress>

<h2>Striped</h2>
<mtx-progress [value]="45" aria-label="Progress" type="info" striped>45%</mtx-progress>
<mtx-progress [value]="35" aria-label="Progress" type="success" striped>35%</mtx-progress>

<h2>Animated</h2>
<mtx-progress [value]="75" aria-label="Progress" type="warning" striped animate>75%</mtx-progress>
<mtx-progress [value]="90" aria-label="Progress" type="danger" striped animate>90%</mtx-progress>

<h2>Custom color</h2>
<mtx-progress [value]="55" aria-label="Progress" foreground="#3949AB" color="white">
  55%
</mtx-progress>
<mtx-progress [value]="70" aria-label="Progress" striped foreground="#6D4C41" color="white">
  70%
</mtx-progress>

<h2>Custom height</h2>
<mtx-progress [value]="25" aria-label="Progress" height="2px"></mtx-progress>
<mtx-progress [value]="35" aria-label="Progress" type="info" height="2px"></mtx-progress>
<mtx-progress [value]="55" aria-label="Progress" type="success" height="2px"></mtx-progress>
<mtx-progress [value]="75" aria-label="Progress" type="warning" height="2px"></mtx-progress>
<mtx-progress [value]="95" aria-label="Progress" type="danger" height="2px"></mtx-progress>
